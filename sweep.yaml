program: lightning.training.py
method: bayes
command:
  - ${env}
  - /home/andy-bio/.anaconda/envs/lightning/bin/python
  - ${program}
  - --npz
  - /home/andy-bio/MyStuff/PhD/Codes/methylation_prediction/chr19.filtered.npz
  - --num_workers
  - "2"
  - --epochs
  - "300"
  - --accelerator
  - cpu

metric:
  name: test_AUROC
  goal: maximize

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1
  
  batch_size:
    values: [16, 32, 64, 128]
  
  optimizers:
    values: ['adam', 'adamw']
  
  dropout:
    distribution: uniform
    min: 0.1
    max: 0.5

  # Parámetros arquitectónicos
  DNA_conv_channels:
    values: [2, 4, 8, 16, 32]

  DNA_kernel_size_1:
    values: [5, 7, 10, 15]

  DNA_kernel_size_2:
    values: [5, 7, 10, 15]

  DNA_kernel_size_3:
    values: [3, 5, 7]

  DNA_stride_1:
    values: [1, 2, 3]

  DNA_stride_2:
    values: [2, 3, 4]

  DNA_stride_3:
    values: [2, 3, 4]
  
  linear_layer2:
    values: [250, 350]
  
  linear_layer3:
    values: [100, 200]
  
  linear_layer4:
    values: [10, 50, 100]